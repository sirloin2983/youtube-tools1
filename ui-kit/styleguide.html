<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ui-kit 見本</title>
<script src="ui-kit.js"></script>
<link rel="stylesheet" href="ui-kit.css">
<style>
  main{max-width:1100px;margin:0 auto;padding:24px 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
  .sw div{border:1px solid var(--line);border-radius:10px;padding:34px 8px 6px;font:11px var(--mono);color:var(--ink-2);position:relative;background:var(--panel)}
  .sw div::before{content:"";position:absolute;inset:6px 6px auto 6px;height:22px;border-radius:6px;background:var(--c)}
</style>
</head>
<body>
<!-- ヘッダーの正しい書き方(全ツール共通)。ブランドのアイコンはツールごとに差し替え -->
<header class="ui-header">
  <a class="ui-brand" href="/">
    <span class="ui-brand-mark" data-tool="studio" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></svg></span>
    <span>切り抜きスタジオ</span><span class="ui-ver">v0.2.0</span>
  </a>
  <nav class="ui-tabs" aria-label="作業の流れ">
    <button type="button" class="ui-tab" aria-pressed="true"><span class="ui-tab-n">1</span>探す</button>
    <button type="button" class="ui-tab" aria-pressed="false"><span class="ui-tab-n">2</span>解析<span class="badge">3</span></button>
    <button type="button" class="ui-tab" aria-pressed="false"><span class="ui-tab-n">3</span>確認・書き出し</button>
  </nav>
  <div class="ui-header-actions">
    <details class="ui-menu">
      <summary class="btn ghost small">他のツール</summary>
      <div class="ui-menu-pop" data-ui-toolnav></div>
    </details>
    <button type="button" class="ui-theme-toggle" data-theme-toggle>
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>
<div class="errbar" hidden>エラーの帯</div>
<main>
  <h1 style="font-size:22px;margin:0 0 4px">ui-kit 見本</h1>
  <p class="hint">右上のボタンでダーク/ライトを切り替えて、両方で読みやすいか確認するための見本です。</p>

  <div class="grid">
    <section class="card">
      <div class="card-head"><h2 class="card-title">ボタン</h2><span class="card-sub">.btn</span></div>
      <div class="row">
        <button class="btn primary">書き出す</button><button class="btn">キャンセル</button><button class="btn soft">採用</button>
        <button class="btn ghost">閉じる</button><button class="btn danger">削除</button><button class="btn" disabled>無効</button>
        <button class="btn small">小</button><button class="btn" aria-pressed="true">押下中</button>
      </div>
      <div class="row" style="margin-top:10px">
        <div class="ui-seg"><button aria-pressed="true">全部</button><button aria-pressed="false">候補</button><button aria-pressed="false">採用</button></div>
        <div class="btn-group"><button class="btn small">−5</button><button class="btn small">−1</button><button class="btn small">+1</button><button class="btn small">+5</button></div>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><h2 class="card-title">入力</h2></div>
      <div class="fld"><label class="l">動画ファイルのパス</label><input type="text" placeholder="例: C:\Videos\stream.mp4"></div>
      <div class="row" style="margin-top:10px"><select><option>large-v3</option><option>small</option></select><input type="number" value="10" style="width:90px"><input type="search" placeholder="検索"></div>
      <div class="row" style="margin-top:10px"><label class="lag"><input type="checkbox" checked>チェック</label><label class="lag"><input type="checkbox" class="ui-switch" checked>スイッチ</label><input type="range"></div>
    </section>

    <section class="card">
      <div class="card-head"><h2 class="card-title">状態の表示</h2></div>
      <div class="row"><span class="pill">待機</span><span class="pill run">実行中</span><span class="pill ok">完了</span><span class="pill warn">要確認</span><span class="pill err">失敗</span><span class="pill info">情報</span><span class="badge">2</span></div>
      <div class="bar"><i style="width:62%"></i></div>
      <div class="bar indeterminate"><i></i></div>
      <div class="notice">お知らせ(警告)。<code>C:\path</code></div>
      <div class="notice info">お知らせ(情報)</div>
      <div class="notice danger">お知らせ(失敗)</div>
      <p class="hint">キー: <kbd>Space</kbd> 再生 <kbd>Shift</kbd>+<kbd>Space</kbd> 校正済み</p>
    </section>

    <section class="card">
      <div class="card-head"><h2 class="card-title">表</h2></div>
      <table><thead><tr><th>#</th><th>タイトル</th><th class="n">再生数</th></tr></thead>
        <tbody><tr><td>1</td><td>雑談配信</td><td class="n">12,345</td></tr><tr><td>2</td><td>ゲーム実況</td><td class="n">8,901</td></tr></tbody></table>
    </section>

    <details class="card" open><summary>開閉できるカード</summary><p class="hint" style="margin:0">details.card</p></details>
    <div class="empty"><b>まだありません</b>動画を追加すると、ここに表示されます</div>
    <div class="ui-drop">ここに動画や字幕をドロップ</div>
    <div class="card"><div class="ui-skel" style="height:14px;width:70%"></div><div class="ui-skel" style="height:14px;width:45%;margin-top:8px"></div></div>
  </div>

  <h2 style="font-size:16px;margin:24px 0 8px">色</h2>
  <div class="sw" id="sw"></div>
</main>
<div class="toast">保存しました</div>
<script>
  UIKit.tools.render(document.querySelector('[data-ui-toolnav]'), { current: 'studio' });
  document.getElementById('sw').innerHTML = ['--bg','--panel','--panel-2','--line','--ink','--ink-2','--ink-3','--accent','--accent-soft','--ok','--warn','--danger','--info','--c-audio','--c-chat','--c-com']
    .map(v => '<div style="--c:var(' + v + ')">' + v + '</div>').join('');
</script>
</body>
</html>
