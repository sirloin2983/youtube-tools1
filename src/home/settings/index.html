<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>動画編集ツール — 設定</title>
<script src="ui-kit.js"></script>
<link rel="stylesheet" href="ui-kit.css">
<link rel="stylesheet" href="settings.css">
<script src="settings.js" defer></script>
</head>
<body>
<header class="ui-header">
  <nav class="ui-appnav" data-ui-appnav="portal" aria-label="ホーム/スタジオ/編集"></nav>
  <span class="ui-ver" id="ver"></span>
  <div class="ui-header-actions">
    <a class="btn ghost small" href="./" data-ui-portal title="ホームへ戻る">ホームへ</a>
  </div>
</header>
<div class="errbar" id="errbar" role="alert" hidden></div>

<main class="st-main" id="main">
  <div class="st-head">
    <h1 class="st-h1">設定</h1>
    <p class="hint">すべてのツールの設定を 1 つの画面で。変えるとすぐ保存します(「保存」のボタンはありません)。既定と違う値には「標準に戻す」が出ます。</p>
    <div class="st-tools">
      <label class="st-search"><span class="ui-icon" data-icon="search" aria-hidden="true"></span><input type="search" id="stSearch" placeholder="設定を探す(例: 音量・フォルダ・自動)" autocomplete="off" aria-label="設定を探す"></label>
      <span class="hint" id="stCount" role="status"></span>
      <button type="button" class="btn small ghost" id="stCopy" title="今の設定(キー以外)を JSON の文字でコピーします。控えや AI に伝えるときに">設定を JSON でコピー</button>
    </div>
    <p class="notice" id="stOffline" hidden></p>
  </div>
  <div class="st-body">
    <nav class="st-nav" id="stNav" aria-label="設定の節"></nav>
    <div class="st-sections" id="stSections"><p class="hint" id="stLoading">読み込んでいます…</p></div>
  </div>
</main>
</body>
</html>
