<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.ytimg.com https://*.ggpht.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>切り抜きスタジオ</title>
<!-- ui-kit.js は CSS より先に同期で読む(data-theme を先に決めて、ちらつきを防ぐ)。インラインのスクリプトは CSP(script-src 'self')で動かないので使わない -->
<script src="ui-kit.js"></script>
<link rel="stylesheet" href="ui-kit.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="review.css">
</head>
<body>
<header class="ui-header" id="appHeader">
  <nav class="ui-appnav" data-ui-appnav="studio"></nav><span class="ui-ver" id="ver"></span>
  <nav class="ui-tabs" id="steps" aria-label="作業の流れ">
    <button type="button" class="ui-tab step" data-step="rank" aria-pressed="true"><span class="ui-tab-n">1</span>探す<span class="badge cs-tabn" id="badgeRank" hidden></span></button>
    <button type="button" class="ui-tab step" data-step="queue" aria-pressed="false"><span class="ui-tab-n">2</span>解析<span class="badge cs-tabn" id="badgeQueue" hidden></span></button>
    <button type="button" class="ui-tab step" data-step="review" aria-pressed="false"><span class="ui-tab-n">3</span><span class="cs-tab-long">確認・書き出し</span><span class="cs-tab-short" aria-hidden="true">確認</span><span class="badge cs-tabn" id="badgeReview" hidden></span></button>
  </nav>
  <div class="ui-header-actions">
    <button type="button" class="btn ghost small cs-hbtn" id="btnKeys" title="キー操作の一覧(? キー)" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg><span class="cs-hlabel">キー操作</span></button>
    <button type="button" class="btn ghost small cs-hbtn" id="btnSettings" data-ui-settings aria-expanded="false" title="設定(APIキー・出力先フォルダ・事務所の登録・コラボ)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span class="cs-hlabel">設定</span><span class="cs-setwarn" id="settingsDot" hidden aria-hidden="true">!</span><span class="sr-only" id="settingsDotText" hidden>(API キーが未設定)</span></button>
  </div>
</header>
<div class="errbar" id="errBar" hidden role="alert"></div>

<main id="main">
  <section id="paneRank" class="pane" aria-label="① 配信を探す"><div class="cs-loading" aria-busy="true"><div class="ui-skel" style="height:18px;width:30%"></div><div class="ui-skel" style="height:120px;margin-top:14px"></div><div class="ui-skel" style="height:60px;margin-top:12px"></div></div></section>
  <section id="paneQueue" class="pane" aria-label="② 解析" hidden></section>
  <section id="paneReview" class="pane" aria-label="③ 確認・書き出し" hidden></section>
</main>

<dialog class="cs-keyhelp" id="keyHelp" aria-labelledby="keyHelpTitle">
  <div class="ui-dlg-head"><h2 id="keyHelpTitle">キー操作の一覧</h2><button type="button" class="btn ghost small icon" id="keyHelpClose" aria-label="閉じる" title="閉じる(Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="cs-keypreset" id="keyPresetRow" hidden><label class="lag keep" for="rvKeyPreset">まとめて変える</label><select id="rvKeyPreset"><option value="standard">標準</option><option value="left">左手だけ</option><option value="custom" disabled>今の配置(手で変えた)</option></select></div>
  <div id="keyHelpBody"></div>
</dialog>

<div id="toast"></div>
<script src="core.js"></script>
<script src="settings.js"></script>
<script src="rank.js"></script>
<script src="queue.js"></script>
<script src="review.js"></script>
<script src="collab.js"></script>
</body>
</html>
