<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>動画編集ツール — 入口</title>
<script src="/ui-kit.js"></script>
<link rel="stylesheet" href="/ui-kit.css">
<link rel="stylesheet" href="/portal.css">
<script src="/portal.js" defer></script>
</head>
<body>
<header class="ui-header">
  <a class="ui-brand" href="/">
    <span class="ui-brand-mark" data-tool="portal" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><path d="M17.5 14v7M14 17.5h7"/></svg></span>
    <span>動画編集ツール</span><span class="ui-ver" id="ver">入口</span>
  </a>
  <div class="ui-header-actions">
    <span class="pill wait" id="conn">接続中…</span>
    <button type="button" class="ui-theme-toggle" data-theme-toggle>
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>
<div class="errbar" id="errbar" role="alert" hidden></div>

<main class="pt-main" id="main">
  <section class="pt-intro">
    <h1>作業の入口</h1>
    <p class="hint">① で切り抜く → ② で文字起こし・校正 → ③ で友人に渡す Resolve 用のパックを作る。使うツールの「開く」を押すと、新しいタブで開きます。</p>
  </section>

  <ol class="pt-flow" id="flow" aria-label="作業の流れ"></ol>

  <section class="card flat pt-foot" id="dataBox" hidden>
    <div class="row">
      <div class="grow">
        <b>作業データの置き場所</b>
        <div class="hint"><code id="dataDir"></code><br>3つのツールのデータ・設定・記録はここにあります(リポジトリの外)。エクスプローラーのアドレス欄に貼ると開けます。</div>
      </div>
      <button type="button" class="btn" id="btnCopyData">パスをコピー</button>
    </div>
  </section>
  <section class="card flat pt-foot">
    <div class="row">
      <div class="grow">
        <b>すべて終了</b>
        <div class="hint">この入口から起動したツールを止めて、入口も終わります。別の黒い画面で起動したツールは止めません。</div>
      </div>
      <button type="button" class="btn danger" id="btnQuit">すべて終了</button>
    </div>
  </section>
</main>

<section class="pt-done" id="done" hidden>
  <div class="card raised pt-done-card">
    <h1 id="doneTitle">終了しています…</h1>
    <p class="hint" id="doneText">起動したツールを止めています。少し待ってください。</p>
  </div>
</section>

<div class="toast" id="toast" role="status" hidden></div>

<template id="tplTool">
  <li class="card pt-tool">
    <div class="pt-head">
      <span class="pt-step"></span>
      <span class="ui-brand-mark" aria-hidden="true"></span>
      <div class="grow">
        <h2 class="card-title pt-name"></h2>
        <div class="card-sub pt-sub"></div>
      </div>
    </div>
    <div class="pt-status" aria-live="polite"><span class="pill pt-pill"></span><span class="pt-meta hint"></span></div>
    <p class="notice pt-msg" hidden></p>
    <div class="row pt-actions">
      <a class="btn primary pt-open" target="_blank" rel="noopener">開く</a>
      <button type="button" class="btn pt-toggle">停止</button>
      <button type="button" class="btn ghost pt-restart">再起動</button>
    </div>
    <details class="ui-disclosure pt-logbox">
      <summary>ログ</summary>
      <pre class="pt-log" tabindex="0"></pre>
      <div class="hint pt-logpath"></div>
    </details>
  </li>
</template>

<!-- ツールのアイコン(各ツールのヘッダーと同じ)。画面の組み立て時に写す -->
<template id="icon-studio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></svg></template>
<template id="icon-transcribe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 10h4M14 10h3M7 14h7M17 14h0"/></svg></template>
<template id="icon-cut2resolve"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 7h7M14 7h7M3 12h3M10 12h11M3 17h10M17 17h4"/></svg></template>
</body>
</html>
